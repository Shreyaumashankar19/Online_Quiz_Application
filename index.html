<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Quiz Application</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <!-- ========== SCREEN 1: HOME ========== -->
    <section id="home-screen" class="screen card">
      <div class="logo">🎓</div>
      <h1>Online Quiz Application</h1>
      <p class="subtitle">Test your Computer Science and General Knowledge</p>

      <div class="info-boxes">
        <div class="info-box">
          <span class="info-number">10</span>
          <span class="info-label">Questions</span>
        </div>
        <div class="info-box">
          <span class="info-number">15s</span>
          <span class="info-label">Per Question</span>
        </div>
        <div class="info-box">
          <span class="info-number">4</span>
          <span class="info-label">Options Each</span>
        </div>
      </div>

      <button id="start-btn" class="btn btn-primary">Start Quiz</button>
    </section>

    <!-- ========== SCREEN 2: QUIZ ========== -->
    <section id="quiz-screen" class="screen card hidden">

      <div class="quiz-header">
        <span id="question-number" class="question-number">Question 1 of 10</span>
        <span id="timer" class="timer">⏱ 15</span>
      </div>

      <div class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <h2 id="question-text" class="question-text">Question will appear here</h2>

      <div id="options-container" class="options">
        <button class="option-btn" data-index="0"></button>
        <button class="option-btn" data-index="1"></button>
        <button class="option-btn" data-index="2"></button>
        <button class="option-btn" data-index="3"></button>
      </div>

      <button id="next-btn" class="btn btn-primary" disabled>Next Question</button>
    </section>

    <!-- ========== SCREEN 3: RESULT ========== -->
    <section id="result-screen" class="screen card hidden">
      <div class="logo">🏆</div>
      <h1>Quiz Completed!</h1>
      <p id="result-message" class="subtitle">Well done!</p>

      <div class="score-circle">
        <span id="percentage" class="percentage">0%</span>
      </div>

      <p class="final-score">
        Final Score: <strong id="final-score">0</strong> / <strong id="total-questions">10</strong>
      </p>

      <div class="info-boxes">
        <div class="info-box correct-box">
          <span id="correct-count" class="info-number">0</span>
          <span class="info-label">Correct</span>
        </div>
        <div class="info-box wrong-box">
          <span id="wrong-count" class="info-number">0</span>
          <span class="info-label">Wrong</span>
        </div>
      </div>

      <button id="restart-btn" class="btn btn-primary">Restart Quiz</button>
    </section>

  </div>

   <script src="quizLogic.js"></script>
  <script src="script.js"></script>
</body>
</html>
